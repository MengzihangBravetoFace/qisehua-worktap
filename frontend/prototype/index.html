<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奇色花 AI 捐赠人关系维护工作台 · 原型演示</title>
<style>
  :root{
    --brand:#1b6b57;
    --brand-2:#2a8a70;
    --brand-soft:#e8f3ee;
    --accent:#d98a2b;
    --accent-soft:#fdf2e3;
    --bg:#f5f6f3;
    --surface:#ffffff;
    --text:#1f2620;
    --muted:#6f776e;
    --line:#e2e6e0;
    --danger:#c0443a;
    --danger-soft:#fbeae8;
    --warn-soft:#fdf3e2;
    --radius:12px;
    --shadow:0 1px 2px rgba(24,40,30,.05), 0 8px 24px rgba(24,40,30,.05);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
  body.no-scroll{overflow:hidden}
  h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
  p{margin:0}
  button{font:inherit;color:inherit}

  /* ============ 布局 ============ */
  .layout{display:flex;min-height:100vh}
  .sidebar{
    width:236px;flex:0 0 236px;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:20px 14px;gap:18px;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px}
  .brand__logo{
    width:36px;height:36px;flex:0 0 36px;border-radius:10px;
    background:linear-gradient(140deg,var(--brand),var(--brand-2));
    color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;
  }
  .brand__name{font-weight:700;font-size:15px;line-height:1.2}
  .brand__sub{font-size:11.5px;color:var(--muted);line-height:1.3}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav__item{
    display:flex;align-items:center;gap:9px;border:0;background:none;text-align:left;
    padding:8px 10px;border-radius:8px;color:#45504a;cursor:pointer;font-size:13.5px;
    transition:background .15s ease,color .15s ease;
  }
  .nav__item:hover{background:#f4f6f2}
  .nav__item.is-active{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .nav__icon{width:16px;text-align:center;font-size:13px;opacity:.85}
  .nav__badge{margin-left:auto;font-size:10.5px;background:var(--accent-soft);color:#a8691a;border-radius:999px;padding:0 6px;line-height:16px}
  .sidebar__foot{
    margin-top:auto;display:flex;gap:9px;align-items:center;
    border-top:1px solid var(--line);padding:14px 6px 0;
  }
  .avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:#eef2ed;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:#4a5a4f}
  .side-user{font-size:13px;font-weight:600;line-height:1.3}
  .side-role{font-size:11.5px;color:var(--muted);line-height:1.3}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 28px;background:rgba(255,255,255,.85);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;backdrop-filter:blur(6px);
  }
  .crumb{font-size:12.5px;color:var(--muted)}
  .crumb strong{color:var(--text);font-weight:600}
  .crumb span{margin:0 6px;color:#c2c8c0}
  .topbar__right{display:flex;align-items:center;gap:10px}
  .notice{
    margin:0;padding:9px 28px;font-size:12px;color:#7a6a4e;background:#fdf7ec;
    border-bottom:1px solid #f2e6cf;
  }
  #app{padding:24px 28px 56px;max-width:1220px;width:100%}

  /* ============ 通用组件 ============ */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
  .panel__head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .panel__head h3{font-size:15px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .link{border:0;background:none;color:var(--brand);font-size:12.5px;cursor:pointer;padding:2px 4px;border-radius:6px}
  .link:hover{background:var(--brand-soft)}
  .btn{
    border:1px solid transparent;border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600;
    cursor:pointer;background:#fff;transition:all .16s ease;display:inline-flex;align-items:center;gap:6px;
  }
  .btn:active{transform:translateY(1px)}
  .btn--primary{background:var(--brand);color:#fff;box-shadow:0 4px 10px rgba(27,107,87,.18)}
  .btn--primary:hover{background:#175a4a}
  .btn--ghost{border-color:var(--line);color:#46524b}
  .btn--ghost:hover{border-color:#cfd6cd;background:#fafbf9}
  .btn--danger{background:#fff;border-color:#ecc9c4;color:var(--danger)}
  .btn--danger:hover{background:#fdf5f4}
  .btn--sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .input,select.input,textarea.input{
    width:100%;border:1px solid #d8ded5;border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;
    background:#fff;color:var(--text);outline:none;transition:border .15s ease, box-shadow .15s ease;
  }
  .input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(42,138,112,.12)}
  textarea.input{resize:vertical;min-height:78px;line-height:1.6}
  label.field{display:block;margin-bottom:12px}
  label.field > span{display:block;font-size:12.5px;color:#5b675f;margin-bottom:5px}
  .req{color:var(--danger)}
  .hint{font-size:12px;color:var(--muted)}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#f0f2ee;color:#5b665e;line-height:18px;white-space:nowrap}
  .tag--brand{background:var(--brand-soft);color:var(--brand)}
  .tag--warn{background:var(--warn-soft);color:#a8691a}
  .tag--danger{background:var(--danger-soft);color:var(--danger)}
  .tag--ai{background:#eef0fb;color:#4b57a8}
  .tag--demo{background:#eef0fb;color:#4b57a8}
  .table{width:100%;border-collapse:collapse;font-size:13px}
  .table th{
    text-align:left;font-weight:600;font-size:12px;color:#78827a;padding:8px 10px;
    border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbf9;
  }
  .table td{padding:10px;border-bottom:1px solid #eef0ec;vertical-align:top}
  .table tr:last-child td{border-bottom:0}
  .table tr:hover td{background:#fcfdfb}
  .table-scroll{overflow-x:auto;margin:0 -4px}
  .table a,.cell-link{border:0;background:none;padding:0;color:var(--text);font-weight:600;cursor:pointer;text-align:left}
  .cell-link:hover{color:var(--brand)}
  .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .stat__label{font-size:12px;color:var(--muted)}
  .stat__value{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0;line-height:1.2}
  .stat__hint{font-size:11.5px;color:#98a097}
  .stat--warn .stat__value{color:#a8691a}
  .stat--danger .stat__value{color:var(--danger)}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}

  /* ============ 待办 ============ */
  .task{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid #eff1ed}
  .task:last-child{border-bottom:0}
  .task__check{
    width:18px;height:18px;flex:0 0 18px;border-radius:5px;border:1.5px solid #c6cec4;margin-top:3px;background:#fff;
    cursor:pointer;display:grid;place-items:center;font-size:11px;color:transparent;transition:all .15s ease;
  }
  .task__check:hover{border-color:var(--brand-2);color:var(--brand-2)}
  .task__main{flex:1;min-width:0}
  .task__title{font-size:13.5px;font-weight:600;line-height:1.5}
  .task__meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .task__ops{display:flex;gap:6px;align-items:center}
  .task.is-done{opacity:.55}
  .task.is-done .task__title{text-decoration:line-through}

  /* ============ 流程说明 ============ */
  .flow{list-style:none;margin:0;padding:0;counter-reset:step}
  .flow li{
    position:relative;padding:9px 0 9px 30px;border-bottom:1px dashed #e8ebe6;font-size:13px;
    display:flex;justify-content:space-between;gap:10px;align-items:center;
  }
  .flow li:last-child{border-bottom:0}
  .flow li::before{
    counter-increment:step;content:counter(step);
    position:absolute;left:0;top:11px;width:20px;height:20px;border-radius:50%;
    background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:700;
    display:grid;place-items:center;
  }

  /* ============ 详情 ============ */
  .detail-hero{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .detail-hero h2{font-size:21px;margin:1px 0 4px}
  .detail-hero__meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
  .detail-hero__ops{display:flex;gap:8px;flex-wrap:wrap}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 20px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .info-grid .k{font-size:11.5px;color:#8b948c}
  .info-grid .v{font-size:13.5px;font-weight:500}
  .history-note{margin-top:14px;background:#fafbf8;border:1px dashed #dfe4db;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#5f6a62}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab{border:0;background:none;padding:9px 12px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.is-active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

  /* 时间线 */
  .tl{list-style:none;margin:0;padding:0}
  .tl__item{position:relative;padding:0 0 18px 22px;border-left:1.5px solid #e6eae3;margin-left:5px}
  .tl__item:last-child{border-left-color:transparent;padding-bottom:0}
  .tl__dot{position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--brand-2)}
  .tl__item.is-system .tl__dot{border-color:#b7c0b6;background:#f1f3ef}
  .tl__item.is-ai .tl__dot{border-color:#6b76c4}
  .tl__meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:3px}
  .tl__item p{margin:0;font-size:13.5px;color:#2c352e}
  .promise{margin-top:7px;background:var(--warn-soft);border-left:3px solid #e0a94f;border-radius:0 7px 7px 0;padding:6px 10px;font-size:12.5px;color:#7a5a1f;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* ============ 状态/进度 ============ */
  .bar{height:7px;border-radius:999px;background:#eef1ec;overflow:hidden}
  .bar__fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand-2),var(--brand))}
  .bar__fill--done{background:#9fb4a6}
  .wish{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 0;border-bottom:1px solid #eff1ed}
  .wish:last-child{border-bottom:0}
  .wish__name{font-size:13.5px;font-weight:600}
  .wish__meta{font-size:12px;color:var(--muted)}
  .wish__bar{grid-column:1/-1}
  .wish__head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .wish__title{border:0;background:none;padding:0;text-align:left;font-family:inherit;font-size:13.5px;font-weight:650;color:var(--text);cursor:pointer}
  .wish__title:hover{color:var(--brand)}
  .wish-back{border:0;background:none;padding:0;color:var(--brand);font-size:12.5px;cursor:pointer;margin-bottom:6px}
  .wish-back:hover{text-decoration:underline}
  .wish-detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center}
  .donut{position:relative;width:150px;height:150px}
  .donut svg{display:block;width:150px;height:150px;transform:rotate(-90deg)}
  .donut__center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .donut__num{font-size:20px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .donut__label{font-size:11px;color:var(--muted);line-height:1.3}
  .legend{display:flex;flex-direction:column;gap:9px}
  .legend__item{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
  .legend__dot{width:9px;height:9px;flex:0 0 9px;border-radius:3px}
  .legend__name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .legend__val{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mini-stat{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fbfcfa}
  .mini-stat__num{font-size:18px;font-weight:700;line-height:1.25}
  .mini-stat__label{font-size:11.5px;color:var(--muted)}
  .bars{display:flex;flex-direction:column;gap:11px}
  .bars__row{display:grid;grid-template-columns:78px 1fr 42px;gap:10px;align-items:center;font-size:12.5px;color:#4d584f}
  .bars__track{height:9px;border-radius:999px;background:#eef1ec;overflow:hidden}
  .bars__fill{height:100%;border-radius:999px;background:var(--brand-2);opacity:.8}
  .bars__num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ============ 导入 ============ */
  .dropzone{
    border:1.5px dashed #cfd8cc;border-radius:10px;padding:22px;text-align:center;background:#fbfcfa;
    cursor:pointer;transition:border-color .15s ease,background .15s ease;
  }
  .dropzone:hover,.dropzone.is-over{border-color:var(--brand);background:#f4faf6}
  .dropzone--loaded{cursor:default;border-style:solid;background:#f7fbf8}
  .dropzone strong{display:block;font-size:13.5px;margin-bottom:3px}
  .table input[type="checkbox"]{accent-color:var(--brand);width:15px;height:15px;cursor:pointer}
  .ck{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
  .ck__box{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fbfcfa}
  .ck__num{font-size:19px;font-weight:700;line-height:1.2}
  .ck__label{font-size:11.5px;color:var(--muted)}
  .ck__box--warn .ck__num{color:#a8691a}
  .ck__box--danger .ck__num{color:var(--danger)}

  /* ============ 门户通用组件（外部人员门户使用） ============ */
  .portal-hero{
    background:linear-gradient(135deg,#1b6b57,#2a8a70);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:18px;
    display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end;box-shadow:var(--shadow);
  }
  .portal-hero h2{font-size:20px;margin-bottom:4px}
  .portal-hero p{font-size:12.5px;opacity:.85}
  .portal-hero__stats{display:flex;gap:26px}
  .portal-hero__num{font-size:22px;font-weight:700;line-height:1.2}
  .portal-hero__label{font-size:11.5px;opacity:.8}
  .donation-card{border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:14px;background:#fff}
  .donation-card__head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
  .donation-card__title{font-size:14.5px;font-weight:650}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  .step{position:relative;background:#fafbf8;border:1px solid #edf0ea;border-radius:8px;padding:9px 10px}
  .step__label{font-size:10.5px;color:#8b948c;letter-spacing:.02em}
  .step__text{font-size:12.5px;line-height:1.5;margin-top:1px}
  .step--done{border-color:#d9e7df;background:#f6faf7}
  .step--done .step__label{color:var(--brand)}
  .portal-foot{font-size:12px;color:var(--muted);text-align:center;padding:6px 0 0}
  .success-card{background:#f5faf6;border:1px solid #d7e8dd;border-radius:11px;padding:18px}
  .success-card h3{font-size:14.5px;color:var(--brand);margin-bottom:5px}

  /* ============ 弹窗 / 提示 ============ */
  .modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;visibility:hidden;transition:visibility 0s linear .2s}
  .modal.is-open{visibility:visible;transition-delay:0s}
  .modal__mask{position:absolute;inset:0;background:rgba(22,32,26,.42);opacity:0;transition:opacity .2s ease}
  .modal.is-open .modal__mask{opacity:1}
  .modal__box{
    position:relative;width:min(560px,100%);max-height:86vh;overflow-y:auto;background:#fff;border-radius:14px;
    box-shadow:0 24px 64px rgba(18,30,23,.24);opacity:0;transform:translateY(12px) scale(.985);
    transition:opacity .2s ease, transform .2s ease;
  }
  .modal.is-open .modal__box{opacity:1;transform:none}
  .modal__head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 10px}
  .modal__head h3{font-size:16px}
  .modal__x{border:0;background:none;font-size:22px;line-height:1;color:#98a097;cursor:pointer;border-radius:6px;width:28px;height:28px}
  .modal__x:hover{background:#f2f4f0;color:var(--text)}
  .modal__body{padding:0 20px 4px}
  .modal__foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 18px;flex-wrap:wrap}
  .form-err{color:var(--danger);font-size:12.5px;min-height:18px;margin-bottom:4px}
  .toast{
    position:fixed;left:50%;bottom:26px;z-index:90;transform:translate(-50%,12px);opacity:0;pointer-events:none;
    background:#22302a;color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;box-shadow:0 10px 26px rgba(0,0,0,.2);
    transition:opacity .18s ease, transform .18s ease;max-width:calc(100vw - 40px);text-align:center;
  }
  .toast.is-show{opacity:1;transform:translate(-50%,0)}
  .toast--danger{background:#8f2f27}
  .toast--ok{background:#1b6b57}

  /* ============ 登录演示 ============ */
  .layout.is-login{display:block}
  .layout.is-login .sidebar,.layout.is-login .topbar,.layout.is-login .notice{display:none}
  .layout.is-login #app{max-width:none;width:100%;padding:0}
  .login__demo{background:#fafbf8;border:1px dashed #dfe4db;border-radius:9px;padding:10px 12px;font-size:12px;color:#5f6a62;margin-top:12px;line-height:1.8}
  .login__demo b{color:#3c473f}

  /* ============ 公开首页 ============ */
  .landing{background:#f7f5ef;color:#1a241e;min-height:100vh}
  .landing a{color:inherit;text-decoration:none}

  .hero::before{
    content:"";position:absolute;inset:0;z-index:0;
    background:linear-gradient(90deg,rgba(8,21,15,.86) 0%,rgba(8,21,15,.64) 42%,rgba(8,21,15,.24) 74%,rgba(8,21,15,.42) 100%),
               linear-gradient(180deg,rgba(8,21,15,.55) 0%,rgba(8,21,15,.05) 30%,rgba(8,21,15,.62) 100%);
  }
  .hero > *{position:relative;z-index:1}
  .lp-nav{display:flex;align-items:center;gap:26px;padding:20px clamp(20px,5vw,64px)}
  .lp-brand{display:flex;align-items:center;gap:11px}
  .lp-brand__logo{
    width:38px;height:38px;border-radius:50%;background:#f6f2e6;color:#1b6b57;
    display:grid;place-items:center;font-family:"Songti SC","STSong",serif;font-size:19px;font-weight:700;
  }
  .lp-brand__name{font-size:16.5px;font-weight:700;letter-spacing:.08em;line-height:1.2}
  .lp-brand__sub{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.72);margin-top:2px}
  .lp-links{display:flex;gap:22px;font-size:12.5px;color:rgba(255,255,255,.86)}
  .lp-links a:hover{color:#fff;text-decoration:underline;text-underline-offset:6px}
  .lp-nav__right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .lp-login{
    border:0;background:#f6f2e6;color:#174d3c;border-radius:999px;padding:9px 22px;
    font-size:12.5px;font-weight:650;cursor:pointer;letter-spacing:.04em;box-shadow:0 8px 22px rgba(0,0,0,.2);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .lp-login:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,0,0,.26)}
  .hero__body{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:800px;padding:34px clamp(20px,5vw,64px) 20px}
  .hero__eyebrow{
    display:inline-flex;align-items:center;gap:8px;width:fit-content;margin-bottom:20px;
    border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.13);border-radius:999px;
    padding:5px 14px;font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.92);
  }
  .hero__eyebrow i{width:5px;height:5px;border-radius:50%;background:#f0cf94;font-style:normal}
  .hero h1{
    font-family:"Songti SC","STSong","SimSun",Georgia,serif;font-weight:700;
    font-size:clamp(38px,5.3vw,62px);line-height:1.2;letter-spacing:.01em;margin-bottom:18px;
    text-shadow:0 2px 26px rgba(0,0,0,.35);
  }
  .hero h1 em{font-style:normal;color:#f1d29a}
  .hero__desc{max-width:530px;font-size:14px;line-height:1.95;color:rgba(255,255,255,.87);margin-bottom:28px}
  .hero__actions{display:flex;gap:12px;flex-wrap:wrap}
  .lp-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;
    padding:11px 24px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;
    transition:background .15s ease,color .15s ease,transform .15s ease;

  /* ---------------- 视图：心愿单详情 ---------------- */
  function viewWishDetail() {
    var w = DATA.wishlist.filter(function (x) { return x.id === state.wishId; })[0] || DATA.wishlist[0];
    var contribs = (w.contribs || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var total = contribs.reduce(function (s, c) { return s + c.qty; }, 0);

    var grouped = {};
    var order = [];
    contribs.forEach(function (c) {
      if (!grouped[c.donorId]) { grouped[c.donorId] = 0; order.push(c.donorId); }
      grouped[c.donorId] += c.qty;
    });

    var COLORS = ['#1b6b57', '#2a8a70', '#7fae94', '#d98a2b', '#5b6f8f'];
    var R = 46;
    var CIRC = 2 * Math.PI * R;
    var offset = 0;
    var segs = '';
    var legend = '';
    order.forEach(function (id, i) {
      var donor = donorById(id);
      var qty = grouped[id];
      var ratio = total ? qty / total : 0;
      var len = CIRC * ratio;
      segs += '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="' + COLORS[i % COLORS.length] + '" stroke-width="16" ' +
        'stroke-dasharray="' + len.toFixed(2) + ' ' + Math.max(0, CIRC - len).toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '"></circle>';
      offset += len;
      var pct = (ratio * 100).toFixed(1).replace(/\.0$/, '');
      legend += '<div class="legend__item">' +
        '<span class="legend__dot" style="background:' + COLORS[i % COLORS.length] + '"></span>' +
        '<span class="legend__name">' + esc(donor.name) + '</span>' +
        '<span class="legend__val">' + qty + ' ' + esc(w.unit) + ' · ' + pct + '%</span>' +
        '</div>';
    });

    var unarrived = contribs.filter(function (c) { return c.status === '未到账'; }).length;
    var pctAll = Math.round((w.got / w.need) * 100);
    var left = Math.max(0, w.need - w.got);

    var rows = contribs.length ? contribs.map(function (c, i) {
      var donor = donorById(c.donorId);
      var chip = c.status === '已到账' ? '<span class="tag tag--brand">已到账</span>' : '<span class="tag tag--danger">未到账</span>';
      return '<tr>' +
        '<td><button class="cell-link" data-act="open-donor" data-id="' + donor.id + '">' + esc(donor.name) + '</button>' +
          '<div class="hint">' + esc(donor.type) + '</div></td>' +
        '<td class="small">' + c.date + '</td>' +
        '<td>' + esc(c.item) + '</td>' +
        '<td class="small" style="white-space:nowrap">' + c.qty + ' ' + esc(c.unit) + '</td>' +
        '<td>' + chip + '</td>' +
        '<td class="small muted">' + esc(c.note) + '</td>' +
        '</tr>';
    }).join('') : '<tr><td colspan="6"><div class="empty">还没有捐赠记录，可点右上角「登记认领」</div></td></tr>';

    return '<section class="panel">' +
      '<button class="wish-back" data-act="view" data-view="wishlist">← 返回心愿单</button>' +
      '<div class="wish-detail-head">' +
        '<div>' +
          '<h2 style="font-size:20px;margin:2px 0 4px">' + esc(w.name) + '</h2>' +
          '<div class="hint">已认领 ' + w.got + ' / ' + w.need + ' ' + esc(w.unit) + ' · 完成度 ' + pctAll + '% · ' +
            (w.status === '已完成' ? '已完成' : '进行中') + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          (w.status === '已完成' ? '<span class="tag tag--brand">已完成</span>'
            : '<button class="btn btn--primary btn--sm" data-act="wish-claim" data-id="' + w.id + '">登记认领</button>') +
        '</div>' +
      '</div>' +
      '<div class="bar" style="margin-top:16px"><div class="bar__fill' + (w.status === '已完成' ? ' bar__fill--done' : '') + '" style="width:' + pctAll + '%"></div></div>' +
    '</section>' +
    '<div class="cols">' +
      '<section class="panel">' +
        '<div class="panel__head"><h3>各捐赠人捐赠占比</h3><span class="hint">按认领数量（含未到账）计算</span></div>' +
        (contribs.length
          ? '<div class="donut-wrap">' +
              '<div class="donut">' +
                '<svg viewBox="0 0 120 120" role="img" aria-label="捐赠人占比环形图">' +
                  '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="#eef1ec" stroke-width="16"></circle>' + segs +
                '</svg>' +
                '<div class="donut__center"><div><div class="donut__num">' + total + '</div>' +
                  '<div class="donut__label">' + esc(w.unit) + ' 已认领</div></div></div>' +
              '</div>' +
              '<div class="legend">' + legend + '</div>' +
            '</div>'
          : '<div class="empty">还没有捐赠人认领</div>') +
      '</section>' +
      '<section class="panel">' +
        '<div class="panel__head"><h3>概况</h3></div>' +

        '</div>' +
        '<p class="hint" style="margin-top:12px">未到账不影响占比展示，但到账前不能标记为已回馈（F-04）。</p>' +
      '</section>' +
    '</div>' +
    '<section class="panel">' +
      '<div class="panel__head"><h3>捐赠内容明细</h3><span class="hint">图表占比与下表数量一致</span></div>' +
      '<div class="table-scroll"><table class="table"><thead><tr>' +

      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</section>';
  }

  /* ---------------- 视图：分析（P1 简化版） ---------------- */
  function viewAnalysis() {
    var counts = {};
    DATA.donors.forEach(function (d) { counts[d.type] = (counts[d.type] || 0) + 1; });
    var max = 0;
    Object.keys(counts).forEach(function (k) { if (counts[k] > max) max = counts[k]; });
    var bars = Object.keys(counts).map(function (k) {
      return '<div class="bars__row"><span>' + k + '</span><div class="bars__track"><div class="bars__fill" style="width:' + Math.round(counts[k] / max * 100) + '%"></div></div><span class="bars__num">' + counts[k] + '</span></div>';
    }).join('');

    var gap30 = DATA.donors.filter(function (d) { return daysSince(d.lastContact) <= 30; }).length;
    var gap90 = DATA.donors.filter(function (d) { var g = daysSince(d.lastContact); return g > 30 && g <= 90; }).length;
    var gapMore = DATA.donors.length - gap30 - gap90;

    return '<section class="panel">' +
      '<div class="panel__head"><h3>资源类型分布</h3><span class="tag tag--warn">P1 · 仅聚合视图</span></div>' +

          '<div class="bars__row"><span>90 天以上</span><div class="bars__track"><div class="bars__fill" style="width:' + Math.round(gapMore / Math.max(1, DATA.donors.length) * 100) + '%"></div></div><span class="bars__num">' + gapMore + '</span></div>' +

  /* ---------------- 视图：外部人员 · 捐赠人门户（F-07） ---------------- */
  function viewExternalPortal() {
    var acc = state.auth.account || { name: '捐赠人', masked: '—', method: '手机号', donorId: null };
    var donor = acc.donorId ? donorById(acc.donorId) : null;

    var rows = [];
    if (donor) {
      DATA.donations.filter(function (n) { return n.donorId === donor.id; }).forEach(function (n) {
        rows.push({
          date: n.date, title: n.item, cat: n.cat, dest: n.dest,
          feedback: n.feedback, arrived: n.feedback !== '未到账', wish: false
        });
      });
      DATA.wishlist.forEach(function (w) {
        (w.contribs || []).forEach(function (c) {
          if (c.donorId !== donor.id) return;
          var dup = DATA.donations.some(function (n) {
            return n.donorId === donor.id && n.wishId === w.id && n.date === c.date;
          });
          if (dup) return;
          rows.push({
            date: c.date, title: c.item + ' ×' + c.qty + ' ' + c.unit, cat: '物资', dest: c.note,
            feedback: c.status === '未到账' ? '未到账' : '待回馈', arrived: c.status !== '未到账', wish: true
          });
        });
      });
    }
    rows.sort(function (a, b) { return a.date < b.date ? 1 : -1; });

    var cards = rows.map(function (n) {
      var chip = n.feedback === '已回馈' ? '<span class="tag tag--brand">已反馈</span>'
        : n.feedback === '未到账' ? '<span class="tag tag--danger">未到账</span>'
          : '<span class="tag tag--warn">待反馈</span>';
      var usedText = n.feedback === '已回馈'
        ? (n.wish ? '已发送去向说明' : '已发送到位照片与说明')
        : (n.arrived ? '使用进展由机构反馈' : '等待物资到账');
      return '<div class="donation-card">' +
        '<div class="donation-card__head">' +
          '<div><div class="donation-card__title">' + esc(n.title) + '</div>' +
          '<div class="hint">' + n.date + ' · ' + esc(n.cat) + (n.wish ? ' · 心愿单认领' : '') + '</div></div>' +
          chip +
        '</div>' +
        '<div class="steps">' +
          '<div class="step' + (n.arrived ? ' step--done' : '') + '"><div class="step__label">已接收</div>' +
            '<div class="step__text">' + (n.arrived ? n.date + ' 入库登记' : '等待物资到账') + '</div></div>' +
          '<div class="step' + (n.arrived ? ' step--done' : '') + '"><div class="step__label">已分配</div>' +
            '<div class="step__text">' + (n.arrived ? esc(n.dest) : '到账后更新去向') + '</div></div>' +
          '<div class="step' + (n.feedback === '已回馈' ? ' step--done' : '') + '"><div class="step__label">已使用 / 反馈</div>' +
            '<div class="step__text">' + esc(usedText) + '</div></div>' +
        '</div>' +
      '</div>';
    }).join('');

    var feedbackRows = rows.filter(function (n) { return n.feedback === '已回馈'; });
    var waitFeedback = rows.filter(function (n) { return n.feedback === '待回馈'; }).length;
    var latest = rows.length ? rows[0].date.slice(0, 7) : '—';

        '<label class="field"><span>支持意向类型 <span class="req">*</span></span>' +
          '<select class="input" id="intentType">' + options(['物资捐赠', '资金资助', '志愿服务', '月捐意向'], '物资捐赠') + '</select></label>' +

          '<input class="input" id="intentDetail" placeholder="例如：想捐 20 套绘本，11 月底前可以寄出"></label>' +
        '<label class="field"><span>留言（选填）</span>' +
          '<textarea class="input" id="intentMsg" placeholder="想了解的事项、方便联系的时间等"></textarea></label>' +
        '<label class="field"><span>联系方式（选填）</span>' +
          '<input class="input" id="intentPhone" placeholder="手机号或微信，方便机构与你联系"></label>' +
        '<div class="form-err" id="portalErr"></div>' +
        '<button type="button" class="btn btn--primary" data-act="intent-submit">提交支持意向</button>' +
      '</form>';

    return '<div class="ext-shell">' +
      '<header class="ext-top">' +
        '<div class="brand" style="padding:0">' +
          '<div class="brand__logo">奇</div>' +
          '<div><div class="brand__name">奇色花</div><div class="brand__sub">捐赠人门户</div></div>' +
        '</div>' +
        '<div class="ext-top__right">' +
          '<span class="tag tag--brand">捐赠人端</span>' +
          '<span class="ext-user">' + esc(acc.name) + (donor ? ' · ' + esc(donor.name) : '') + '</span>' +
          '<button class="btn btn--ghost btn--sm" data-act="logout">退出登录</button>' +
        '</div>' +

      '<main class="ext-main">' +
        '<div class="portal-hero">' +
          '<div><h2>你好，' + esc(acc.name) + '</h2>' +
            '<p>这里只展示与' + (donor ? '你（' + esc(donor.name) + '）' : '你本人') + '相关的捐赠记录与物资去向。</p></div>' +
          '<div class="portal-hero__stats">' +
            '<div><div class="portal-hero__num">' + rows.length + '</div><div class="portal-hero__label">累计支持次数</div></div>' +
            '<div><div class="portal-hero__num">' + waitFeedback + '</div><div class="portal-hero__label">待反馈</div></div>' +
            '<div><div class="portal-hero__num">' + latest + '</div><div class="portal-hero__label">最近一次</div></div>' +
          '</div>' +
        '</div>' +
        '<div class="cols">' +
          '<section class="panel">' +
            '<div class="panel__head"><h3>我的捐赠与物资去向</h3><span class="hint">F-07 · P1 简化版（只读）</span></div>' +
            (rows.length ? cards : '<div class="empty">暂未查到与你账号绑定的捐赠记录，可在右侧提交「申请绑定」。</div>') +
            '<p class="hint">只读展示，仅包含你本人的记录；如需更正信息，请联系机构。</p>' +
          '</section>' +
          '<div>' +
            '<section class="panel">' +
              '<div class="panel__head"><h3>提交支持意向</h3><span class="hint">提交后由机构跟进</span></div>' +
              intentBlock +
            '</section>' +
            '<section class="panel">' +
              '<div class="panel__head"><h3>回馈与报告</h3><span class="tag tag--warn">P2 · 规划中</span></div>' +
              (feedbackRows.length
                ? feedbackRows.map(function (n) {
                    return '<div class="donation-card" style="margin-bottom:8px"><div class="donation-card__title">' + esc(n.title) + '</div>' +
                      '<div class="hint">' + n.date + ' · 机构已发送回馈说明</div></div>';

      '</main>' +
    '</div>';
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');

    if (act === 'view') {
      if ($('#modal').classList.contains('is-open')) closeModal();
      state.view = t.getAttribute('data-view');
      if (state.view === 'donors') { state.donorQuery = ''; state.donorType = 'all'; }
      render();
      return;
    }
    if (act === 'guide') { guideModal(); return; }
    if (act === 'close-modal') { closeModal(); return; }

    if (act === 'open-login') { openAuthModal(); return; }
    if (act === 'auth-pick') {
      state.auth.pick = t.getAttribute('data-identity');
      state.auth.step = 'form';
      state.auth.draft = '';
      state.auth.draftPwd = '';
      refreshAuthModal();
      var loginInput = $('#loginId');
      if (loginInput) loginInput.focus();
      return;
    }
    if (act === 'auth-back') {
      state.auth.step = 'pick';
      refreshAuthModal();
      return;
    }
    if (act === 'login-fill') {
      state.auth.draft = state.auth.pick === 'staff' ? 'qisehua_admin' : 'wanghaitao';
      state.auth.draftPwd = state.auth.pick === 'staff' ? 'qisehua2026' : 'donor2026';
      refreshAuthModal();
      var filled = $('#loginId');
      if (filled) filled.focus();
      return;
    }
    if (act === 'login-submit') {
      var raw = (($('#loginId') || {}).value || '').trim();
      var pwd = ($('#loginPwd') || {}).value || '';
      var errBox = $('#loginErr');
      var pick = state.auth.pick;
      var other = pick === 'staff' ? 'external' : 'staff';
      if (!raw) { if (errBox) errBox.textContent = '请输入账号。'; return; }
      if (!pwd) { if (errBox) errBox.textContent = '请输入密码。'; return; }
      var key = raw.toLowerCase();
      var matched = BOUND_ACCOUNTS[pick][key];
      if (!matched) {
        if (BOUND_ACCOUNTS[other][key]) {
          if (errBox) errBox.textContent = '账号与所选身份不匹配：该账号属于「' + (other === 'staff' ? '机构工作人员' : '外部人员') + '」，请切换身份后重试。';
        } else {
          if (errBox) errBox.textContent = '账号不存在，请检查后重试。';
        }
        return;
      }
      if (matched.password !== pwd) {
        if (errBox) errBox.textContent = '密码错误，请重新输入。';
        return;
      }
      state.auth.loggedIn = true;
      state.auth.identity = pick;
      state.auth.draft = raw;
      state.auth.draftPwd = pwd;
      state.auth.step = 'pick';
      state.auth.account = {
        name: matched.name,
        donorId: matched.donorId || null,
        role: pick === 'staff' ? '机构工作人员' : '外部人员',
        method: '账号密码',
        masked: key
      };
      state.view = 'dashboard';
      state.intentSent = false;
      closeModal();
      render();
      toast(pick === 'staff' ? '登录成功，已进入管理端' : '登录成功，已进入捐赠人门户', 'ok');
      return;
    }
    if (act === 'logout') {
      state.auth = { loggedIn: false, pick: 'staff', identity: 'staff', step: 'pick', draft: '', draftPwd: '', account: null };
      state.view = 'dashboard';
      state.intentSent = false;
      render();
      toast('已退出登录');
      return;
    }
    if (act === 'open-new-donor') { newDonorModal(); return; }
    if (act === 'create-donor') {
      var name = ($('#f_name') || {}).value || '';
      var contact = ($('#f_contact') || {}).value || '';
      var type = ($('#f_type') || {}).value || DONOR_TYPES[0];
      name = name.trim(); contact = contact.trim();
      var err = $('#formErr');
      if (!name || !contact) {
        if (err) err.textContent = '请填写名称 / 单位与联系人（必填）。';
        return;
      }
      if (/教育厅|教育局|政府|教科文组织|民政|管委会/.test(name)) {
        openModal('已拦截：政府类主体不入库',
          '<p class="small">按脱敏边界，政府类主体整条不入库、不进 AI，不做打码式脱敏（F-12）。</p>' +
          '<div class="promise" style="margin-top:12px"><span>已生成拒收记录：' + esc(name) + ' · 2026-11-23 · 操作人 吴冲</span></div>',
          '<button class="btn btn--ghost" data-act="close-modal">返回</button>');
        toast('已拦截并生成拒收记录（F-12）', 'danger');
        return;
      }
      var dup = DATA.donors.some(function (d) { return d.name === name; });
      var newId = 'd' + (Date.now() % 100000);
      DATA.donors.unshift({
        id: newId, name: name, type: type, contact: contact,
        title: ($('#f_title') || {}).value || '待补充', titleHistory: [], phone: ($('#f_phone') || {}).value || '未填写',
        source: ($('#f_source') || {}).value || '未填写', industry: '待补充', method: '待补充',
        lastContact: TODAY, owner: '吴冲', region: '郑州', note: ($('#f_note') || {}).value || ''
      });
      DATA.timeline[newId] = [{ date: TODAY, kind: '建档', by: '吴冲', system: true, text: '新建档案（' + type + '），必填字段完整。' }];
      DATA.audit.unshift({ time: '2026-11-23 13:20', user: '吴冲', target: name, action: '新建档案', detail: '资源类型：' + type });
      closeModal();
      state.view = 'donorDetail'; state.donorId = newId; state.detailTab = 'timeline';
      render();
      toast(dup ? '档案已创建；检测到同名档案，建议后续合并' : '档案已创建，已进入详情页', dup ? '' : 'ok');
      return;
    }

    if (act === 'open-donor') {
      state.donorId = t.getAttribute('data-id');
      state.view = 'donorDetail';
      state.detailTab = 'timeline';
      render();
      return;
    }
    if (act === 'detail-tab') { state.detailTab = t.getAttribute('data-tab'); render(); return; }

    if (act === 'edit-donor') { editDonorModal(t.getAttribute('data-id')); return; }
    if (act === 'save-donor') {
      var id = t.getAttribute('data-id');
      var dd = donorById(id);
      if (!dd) return;
      var newTitle = ($('#e_title') || {}).value || dd.title;
      var changed = newTitle !== dd.title;
      if (changed && dd.title) {
        dd.titleHistory.push({ title: dd.title, from: '—', to: '2026-11' });
        DATA.timeline[id] = DATA.timeline[id] || [];
        DATA.timeline[id].unshift({ date: TODAY, kind: '档案变更', by: '吴冲', system: true, text: '当前职务由「' + dd.title + '」更新为「' + newTitle + '」；旧职务已保留。' });
        DATA.audit.unshift({ time: '2026-11-23 13:26', user: '吴冲', target: dd.name, action: '档案变更', detail: '职务：' + dd.title + ' → ' + newTitle + '（旧职务保留）' });
      }
      dd.title = newTitle;
      dd.contact = ($('#e_contact') || {}).value || dd.contact;
      dd.phone = ($('#e_phone') || {}).value || dd.phone;
      dd.note = ($('#e_note') || {}).value || dd.note;
      closeModal(); render();
      toast(changed ? '已保存，旧职务已保留（F-05）' : '已保存修改', 'ok');
      return;
    }

    if (act === 'ai-record') { aiRecordModal(t.getAttribute('data-id')); return; }
    if (act === 'ai-parse') {
      var text = (($('#aiText') || {}).value || '').trim();
      if (!text) { toast('请先输入一句互动内容', 'danger'); return; }
      aiResultModal(t.getAttribute('data-id'));
      return;
    }
    if (act === 'ai-save') {
      var aid = t.getAttribute('data-id');
      DATA.timeline[aid] = DATA.timeline[aid] || [];
      DATA.timeline[aid].unshift({
        date: '2026-11-21', kind: '电话沟通', by: '吴冲', ai: true,
        text: 'AI 从一句话中提取并经人工确认：对方表示年底可再捐一批户外玩具，约 12 月中旬送达，希望收到孩子使用的照片。',
        promise: '12 月中旬前捐赠户外玩具一批', overdue: false
      });
      DATA.tasks.unshift({ id: 't' + (Date.now() % 100000), donorId: aid, title: '跟进：12 月中旬户外玩具捐赠', due: '2026-12-15', owner: '吴冲', source: 'AI 记录生成', status: '待处理', overdue: false });
      DATA.audit.unshift({ time: '2026-11-23 13:31', user: '吴冲', target: donorById(aid).name, action: '新增互动记录', detail: 'AI 草稿 · 人工确认后保存' });
      closeModal();
      state.view = 'donorDetail'; state.donorId = aid; state.detailTab = 'timeline';
      render();
      toast('已保存到时间线（人工确认后）', 'ok');
      return;
    }
    if (act === 'mark-feedback') {
      var nid = t.getAttribute('data-id');
      var rec = DATA.donations.filter(function (n) { return n.id === nid; })[0];
      if (!rec) return;
      if (rec.feedback === '未到账') {
        toast('物资未到账，不能标记为已回馈（F-04）', 'danger');
        return;
      }
      rec.feedback = '已回馈';
      rec.note = '已于 ' + TODAY + ' 发送反馈';
      DATA.audit.unshift({ time: '2026-11-23 13:33', user: '吴冲', target: donorById(rec.donorId).name, action: '更新回馈状态', detail: rec.item + ' 标记为已回馈' });
      render();
      toast('已标记为已回馈', 'ok');
      return;
    }

    if (act === 'task-finish') { taskFinishModal(t.getAttribute('data-id')); return; }
    if (act === 'task-submit') {
      var tid = t.getAttribute('data-id');
      var task = taskById(tid);
      if (!task) return;
      var result = (($('#taskResult') || {}).value || '').trim();
      task.status = '已完成';
      task.overdue = false;
      if (($('#taskTimeline') || {}).checked && result) {
        DATA.timeline[task.donorId] = DATA.timeline[task.donorId] || [];
        DATA.timeline[task.donorId].unshift({ date: TODAY, kind: '任务回填', by: task.owner, text: '完成待办：' + task.title + '；结果：' + result });
      }
      DATA.audit.unshift({ time: '2026-11-23 13:36', user: task.owner, target: donorById(task.donorId).name, action: '完成待办', detail: task.title });
      closeModal(); render();
      toast('已完成，结果已回填到时间线', 'ok');
      return;
    }
    if (act === 'new-task') { newTaskModal(t.getAttribute('data-id')); return; }
    if (act === 'task-create') {
      var nd = ($('#nt_donor') || {}).value;

      DATA.tasks.unshift({
        id: 't' + (Date.now() % 100000), donorId: nd, title: ntitle,

        source: '手动创建', status: '待处理', overdue: false

      closeModal(); render();
      toast('待办已创建', 'ok');

    if (act === 'import-demo') {
      runImportExtract('捐赠人信息一览表（脱敏示意）.xlsx（演示）');
      return;
    }
    if (act === 'import-pick') {
      if (e.target && e.target.id === 'importFile') return;
      var picker = $('#importFile');
      if (picker) picker.click();
      return;
    }
    if (act === 'import-reset') {
      state.importLoaded = false;
      state.importRows = [];
      state.importFile = '';
      state.importDone = 0;
      render();
      return;
    }
    if (act === 'import-approve') {
      var chosen = state.importRows.filter(function (r) { return !r.blocked && r.checked; });
      if (!chosen.length) { toast('请先勾选要通过的行', 'danger'); return; }
      var imported = 0;
      var dup = 0;
      chosen.forEach(function (r, i) {
        if (DATA.donors.some(function (d) { return d.name === r.name; })) {
          r.blocked = true;
          r.checked = false;
          r.reason = '系统中已有同名档案，暂不重复导入';
          dup++;
          return;
        }
        DATA.donors.unshift({
          id: 'd' + ((Date.now() + i) % 1000000),
          name: r.name,
          type: r.type || '爱心企业',
          contact: r.contact || '待补充',
          title: '待补充',
          titleHistory: [],
          phone: '待补充',
          source: r.source || '待补充',
          industry: '待补充',
          method: '待补充',
          lastContact: TODAY,
          owner: '吴冲',
          region: '待补充',
          note: r.note || '由 Excel 导入',
          status: '正常'
        });
        imported++;
        r._added = true;
      });
      state.importRows = state.importRows.filter(function (r) { return !r._added; });
      state.importDone += imported;
      if (imported) {
        DATA.audit.unshift({
          time: '2026-11-23 13:45',
          user: '吴冲',
          target: chosen.filter(function (r) { return r._added; }).map(function (r) { return r.name; }).join('、'),
          action: '导入档案',
          detail: 'Excel 自动提取 · 逐行确认后入库 ' + imported + ' 条'
        });
      }
      render();
      toast(imported
        ? '已导入 ' + imported + ' 条档案' + (dup ? '，' + dup + ' 条同名未导入' : '')
        : '所选行均与已有档案重名，未导入', imported ? 'ok' : 'danger');
      return;
    }

    if (act === 'wish-detail') {
      state.wishId = t.getAttribute('data-id');
      state.view = 'wishDetail';
      render();
      return;
    }
    if (act === 'wish-claim') { wishClaimModal(t.getAttribute('data-id')); return; }
    if (act === 'wish-submit') {
      var wid = t.getAttribute('data-id');
      var w = DATA.wishlist.filter(function (x) { return x.id === wid; })[0];
      var num = parseInt((($('#wc_num') || {}).value || '0'), 10);
      var left = w.need - w.got;
      if (!num || num < 1) { var we = $('#formErr'); if (we) we.textContent = '数量需大于 0（F-04 规则）。'; return; }
      if (num > left) { var we2 = $('#formErr'); if (we2) we2.textContent = '数量超过缺口（还缺 ' + left + ' ' + w.unit + '）。'; return; }
      var wd = ($('#wc_donor') || {}).value;
      var wDest = ($('#wc_dest') || {}).value || '待分配';
      w.got += num;
      if (w.got >= w.need) w.status = '已完成';
      w.contribs = w.contribs || [];
      w.contribs.push({ donorId: wd, date: TODAY, item: w.name, qty: num, unit: w.unit, status: '未到账', note: wDest });
      DATA.donations.unshift({
        id: 'n' + (Date.now() % 100000), donorId: wd, date: TODAY, cat: '物资',
        item: w.name + ' ×' + num + ' ' + w.unit, wishId: w.id,
        dest: wDest, feedback: '未到账', note: '已登记认领，等待物资到账'
      });
      DATA.audit.unshift({ time: '2026-11-23 13:41', user: '吴冲', target: donorById(wd).name, action: '登记认领', detail: w.name + ' ×' + num });
      closeModal(); render();
      toast('已登记认领（未到账），到账后可更新去向', 'ok');
      return;
    }

    if (act === 'donor-type') { state.donorType = t.getAttribute('data-type'); render(); return; }

    if (act === 'intent-submit') {
      var detail = (($('#intentDetail') || {}).value || '').trim();
      if (!detail) {
        var pe = $('#portalErr'); if (pe) pe.textContent = '请填写意向内容。';
        return;
      }
      state.intentSent = true;
      render();
      toast('支持意向已提交，我们会尽快联系你', 'ok');
      return;
    }
    if (act === 'intent-again') { state.intentSent = false; render(); return; }
    if (act === 'bind-apply') {
      var bindName = (state.auth.identity === 'external' && state.auth.account) ? state.auth.account.name : '李静';
      openModal('申请绑定捐赠记录',
        '<p class="small">如果你的捐赠没有显示在这里，可以提交姓名与捐赠时间，由机构核对后绑定，不会展示他人数据（F-07）。</p>' +
        '<label class="field" style="margin-top:12px"><span>姓名 / 单位</span><input class="input" value="' + esc(bindName) + '"></label>' +
        '<label class="field"><span>捐赠时间或内容</span><input class="input" placeholder="例如：2026-06 现金 500 元"></label>',
        '<button class="btn btn--ghost" data-act="close-modal">取消</button>' +
        '<button class="btn btn--primary" data-act="bind-submit">提交申请</button>');
      return;
    }
    if (act === 'bind-submit') { closeModal(); toast('申请已提交，机构核对后为你绑定', 'ok'); return; }
    if (act === 'p2') {
      openModal('月度 / 年度报告（P2 规划中）',
        '<p class="small">规划形态：一页纸汇总你的本年捐赠、物资去向与参与活动；数据不足时降级为简短致谢，不编造叙事。</p>' +
        '<p class="hint" style="margin-top:10px">本期仅预留入口，月捐时间表与目标人数待机构确认。</p>',
        '<button class="btn btn--primary" data-act="close-modal">知道了</button>');
      return;
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target && (e.target.id === 'loginId' || e.target.id === 'loginPwd')) {
      if (e.target.id === 'loginId') state.auth.draft = e.target.value;
      else state.auth.draftPwd = e.target.value;
      var lb = $('#loginErr');
      if (lb) lb.textContent = '';
      return;
    }
    if (e.target && e.target.id === 'donorSearch') {
      state.donorQuery = e.target.value;
      var tbody = $('#donorRows');
      if (tbody) {
        var rows = filteredDonors();
        tbody.innerHTML = rows.length ? rows.map(donorRow).join('') : '<tr><td colspan="8"><div class="empty">没有匹配的档案</div></td></tr>';
      }
    }
  });

  document.addEventListener('change', function (e) {
    if (!e.target) return;
    if (e.target.id === 'importFile') {
      var picked = e.target.files && e.target.files[0];
      runImportExtract(picked ? picked.name : '');
      return;
    }
    if (e.target.id === 'importAll') {
      state.importRows.forEach(function (r) { if (!r.blocked) r.checked = e.target.checked; });
      var boxes = document.querySelectorAll('.import-check');
      for (var i = 0; i < boxes.length; i++) boxes[i].checked = e.target.checked;
      refreshImportControls();
      return;
    }
    if (e.target.classList && e.target.classList.contains('import-check')) {
      var idx = Number(e.target.getAttribute('data-idx'));
      var row = state.importRows.filter(function (r) { return r.idx === idx; })[0];
      if (row) row.checked = e.target.checked;
      refreshImportControls();
    }
  });

  document.addEventListener('dragover', function (e) {
    var zone = e.target.closest && e.target.closest('#importDrop');
    if (zone) { e.preventDefault(); zone.classList.add('is-over'); }
  });
  document.addEventListener('dragleave', function (e) {
    var zone = e.target.closest && e.target.closest('#importDrop');
    if (zone) zone.classList.remove('is-over');
  });
  document.addEventListener('drop', function (e) {
    var zone = e.target.closest && e.target.closest('#importDrop');
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove('is-over');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    runImportExtract(f ? f.name : '');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('#modal').classList.contains('is-open')) closeModal();
  });

  render();
})();
</script>
</body>
</html>
